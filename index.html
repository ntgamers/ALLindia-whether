<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All India Weather Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; text-align: center; margin: 0; padding: 20px; }
        .card { background: white; max-width: 400px; margin: 50px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px; width: 80%; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        .weather-info { margin-top: 15px; text-align: left; background: #eef2f5; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="card">
        <h2>All India Weather</h2>
        <input type="text" id="username" placeholder="Enter Username">
        <button onclick="login()">Login</button>
        <button onclick="loginGuest()" style="background: #6c757d;">Continue as Guest</button>
    </div>

    <!-- Weather Dashboard Screen -->
    <div id="dashboard" class="card hidden">
        <h2 id="welcome-msg">Welcome</h2>
        <input type="text" id="city" placeholder="Enter City Name (e.g. Pune, Delhi)">
        <button onclick="getWeather()">Search Weather</button>

        <div id="weather-result" class="weather-info hidden"></div>
        <button onclick="logout()" style="background: #dc3545; margin-top: 15px;">Logout</button>
    </div>

    <script>
        const API_KEY = "651f547c474636f706ba9b89eaf70fb0";

        function login() {
            let user = document.getElementById("username").value;
            if (user.trim() !== "") {
                showDashboard(user);
            } else {
                alert("Please enter a username or continue as guest.");
            }
        }

        function loginGuest() {
            showDashboard("Guest User");
        }

        function showDashboard(username) {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");
            document.getElementById("welcome-msg").innerText = "Welcome, " + username + "!";
        }

        function logout() {
            document.getElementById("dashboard").classList.add("hidden");
            document.getElementById("login-screen").classList.remove("hidden");
            document.getElementById("weather-result").classList.add("hidden");
            document.getElementById("username").value = "";
        }

        async function getWeather() {
            let city = document.getElementById("city").value;
            let resultDiv = document.getElementById("weather-result");

            if (city.trim() === "") {
                alert("Please enter a city name.");
                return;
            }

            try {
                let response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${API_KEY}`);
                let data = await response.json();

                if (data.cod === 200) {
                    resultDiv.classList.remove("hidden");
                    resultDiv.innerHTML = `
                        <h3>${data.name}, ${data.sys.country}</h3>
                        <p><b>Temperature:</b> ${data.main.temp} °C</p>
                        <p><b>Weather:</b> ${data.weather[0].description}</p>
                        <p><b>Humidity:</b> ${data.main.humidity}%</p>
                        <p><b>Wind Speed:</b> ${data.wind.speed} m/s</p>
                    `;
                } else {
                    alert("City not found. Please check spelling.");
                }
            } catch (error) {
                alert("Unable to fetch weather data.");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D India Map</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="info">3D India Map - Interactive Model</div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. सीन, कैमरा और रेंडरर सेटअप
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -35, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. कंट्रोल्स (माउस से घुमाने के लिए)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 3. लाइट्स (प्रकाश व्यवस्था)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff6b00, 1.5, 100);
        pointLight.position.set(10, -10, 20);
        scene.add(pointLight);

        const dirLight = new THREE.DirectionalLight(0x00ffff, 1);
        dirLight.position.set(-10, 20, 15);
        scene.add(dirLight);

        // 4. भारत के नक्शे के कोऑर्डिनेट्स का रफ आउटलाइन (प्रतीकात्मक 3D एक्सट्रूज़न के लिए)
        // ध्यान दें: वेब पर सटीक геомет्री के लिए GeoJSON की जरूरत होती है, यहाँ हमने विज़ुअल इम्पैक्ट के लिए कस्टमाइज्ड 3D शेप तैयार किया है।
        const indiaPoints = [
            [0, 12], [2, 11], [4, 12], [6, 10], [5, 8], [7, 6], 
            [6, 4], [4, 2], [2, -2], [0, -5], [-2, -8], [-4, -6], 
            [-3, -3], [-5, -1], [-4, 2], [-6, 4], [-4, 7], [-2, 10], [0, 12]
        ];

        const indiaShape = new THREE.Shape();
        indiaPoints.forEach((pt, index) => {
            if (index === 0) indiaShape.moveTo(pt[0], pt[1]);
            else indiaShape.lineTo(pt[0], pt[1]);
        });

        const extrudeSettings = {
            steps: 2,
            depth: 1.5,
            bevelEnabled: true,
            bevelThickness: 0.4,
            bevelSize: 0.4,
            bevelSegments: 3
        };

        const geometry = new THREE.ExtrudeGeometry(indiaShape, extrudeSettings);
        geometry.center(); // सेंटर में लाने के लिए

        // मटेरियल (शाइनी तिरंगा या मॉडर्न थीम)
        const material = new THREE.MeshStandardMaterial({
            color: 0xff9933,
            roughness: 0.3,
            metalness: 0.4,
            wireframe: false
        });

        const indiaMesh = new THREE.Mesh(geometry, material);
        scene.add(indiaMesh);

        // बेस ग्रिड या प्लेटफॉर्म
        const gridHelper = new THREE.GridHelper(50, 50, 0xff0000, 0x333333);
        gridHelper.position.z = -1.5;
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);

        // 5. रिस्पॉन्सिव विंडो रिसाइज
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 6. एनीमेशन लूप
        function animate() {
            requestAnimationFrame(animate);
            
            // हल्का-हल्का रोटेशन ताकि मॉडल जीवंत लगे
            indiaMesh.rotation.z += 0.005;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>

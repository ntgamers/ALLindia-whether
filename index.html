<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT Base - Weather Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- लॉगिन स्क्रीन --- */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .login-card {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 380px;
        }

        .login-logo {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-card h2 {
            font-size: 22px;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 6px;
        }

        .login-card p {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 30px;
        }

        .btn-auth {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-google {
            background: #ffffff;
            color: #24292e;
        }

        .btn-google:hover {
            background: #f3f4f6;
        }

        .btn-guest {
            background: rgba(255, 255, 255, 0.08);
            color: #f0f6fc;
        }

        .btn-guest:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* --- डैशबोर्ड स्क्रीन (लॉगिन के बाद) --- */
        #dashboard-screen {
            display: none;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .dashboard-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 380px;
        }

            font-size: 20px;
            color: #f0f6fc;
            margin-bottom: 4px;
        }

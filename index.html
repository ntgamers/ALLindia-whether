<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map App - Login & Interactive Map</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* --- पुराना लॉगिन स्क्रीन स्टाइल (बिल्कुल सेफ और वैसा ही) --- */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #121212;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .login-card {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
            border: 1px solid #2a2a2a;
        }

        .login-card h2 {
            margin-bottom: 25px;
            color: #fff;
            font-size: 24px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-google {
            background: #ffffff;
            color: #333;
        }

        .btn-google:hover {
            background: #f1f1f1;
        }

        .btn-guest {
            background: #3b82f6;
            color: white;
        }

        .btn-guest:hover {
            background: #2563eb;
        }

        /* --- मेन ऐप डैशबोर्ड (लॉगिन के बाद दिखने वाला) --- */
        #app-screen {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        /* टॉप नेविगेशन बार (सर्च और लॉगआउट के साथ) */
        .top-navbar {
            height: 65px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #2c2c2c;
            z-index: 10;
        }

        .app-title {
            font-size: 18px;
            font-weight: bold;
            color: #3b82f6;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #2a2a2a;
            border-radius: 6px;
            padding: 6px 12px;
            border: 1px solid #444;
            width: 250px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* मैप व्यू कंटेनर (2D ज़ूम और पैन सपोर्ट) */
        #map-viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0b0f19;
            cursor: grab;
        }

        #map-viewport:active {
            cursor: grabbing;
        }

        #map-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            transition: transform 0.05s ease-out;
        }

        /* 2D भारत का नक्शा ग्राफिक / SVG या लेआउट स्टाइल */
        .map-graphic {
            width: 800px;
            height: 800px;
            position: relative;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            border-radius: 20px;
            border: 2px solid #334155;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* राज्यों के क्लिकेबल पॉइंट्स/बटन */
        .state-node {
            position: absolute;
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid #3b82f6;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .state-node:hover {
            background: #3b82f6;
            transform: scale(1.1);
            z-index: 5;
        }

        /* महाराष्ट्र और अन्य लोकेशंस की पोजीशन (2D मैप पर) */
        #state-maharashtra { top: 52%; left: 35%; }
        #state-gujarat { top: 42%; left: 25%; }
        #state-karnataka { top: 68%; left: 38%; }
        #state-delhi { top: 28%; left: 40%; }

        /* ज़ूम कंट्रोल्स साइड में */
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .zoom-btn {
            background: #1e1e1e;
            color: white;
            border: 1px solid #444;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .zoom-btn:hover {
            background: #3b82f6;
            border-color: #3b82f6;
        }
    </style>
</head>
<body>

    <!-- 1. पुराना लॉग इन स्क्रीन -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <button class="btn btn-google" onclick="handleLogin('Google')">Sign in with Google</button>
            <button class="btn btn-guest" onclick="handleLogin('Guest')">Continue as Guest</button>
        </div>
    </div>

    <!-- 2. लॉगिन के बाद दिखने वाला मुख्य ऐप स्क्रीन -->
    <div id="app-screen">
        <!-- टॉप बार: 3D/2D टैब, सर्च और लॉगआउट -->
        <div class="top-navbar">
            <div class="app-title">📍 India Map Explorer (2D)</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search state or city..." onkeyup="filterStates()">
            </div>
            <button class="logout-btn" onclick="handleLogout()">Log Out</button>
        </div>

        <!-- इंटरेक्टिव 2D मैप व्यूपोर्ट (Zoom & Pan Enabled) -->
        <div id="map-viewport">
            <div id="map-container">
                <div class="map-graphic">
                    <div style="position: absolute; top: 20px; color: #94a3b8; font-size: 14px; font-weight: bold;">🇮🇳 INDIA 2D MAP INTERACTIVE</div>
                    
                    <!-- राज्य के बटन्स (क्लिक करने पर पुणे/शहर देख सकते हैं) -->
                    <div id="state-maharashtra" class="state-node" onclick="selectState('Maharashtra')">Maharashtra</div>
                    <div id="state-gujarat" class="state-node" onclick="selectState('Gujarat')">Gujarat</div>
                    <div id="state-karnataka" class="state-node" onclick="selectState('Karnataka')">Karnataka</div>
                    <div id="state-delhi" class="state-node" onclick="selectState('Delhi')">Delhi</div>
                </div>
            </div>

            <!-- ज़ूम इन / आउट बटन -->
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomIn()">+</button>
                <button class="zoom-btn" onclick="zoomOut()">-</button>
            </div>
        </div>
    </div>

    <script>
        // लॉगिन और लॉगआउट फंक्शन
        function handleLogin(type) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
        }

        function handleLogout() {
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        // राज्य क्लिक करने पर एक्शन
        function selectState(stateName) {
            if(stateName === 'Maharashtra') {
                alert("Maharashtra selected! Click on districts like Pune, Mumbai etc.");
            } else {
                alert(stateName + " selected!");
            }
        }

        // ज़ूम और पैन (Zoom & Pan) लॉजिक
        let scale = 1;
        const mapContainer = document.getElementById('map-container');
        const viewport = document.getElementById('map-viewport');

        function zoomIn() {
            if (scale < 2.5) {
                scale += 0.2;
                updateTransform();
            }
        }

        function zoomOut() {
            if (scale > 0.6) {
                scale -= 0.2;
                updateTransform();
            }
        }

        function updateTransform() {
            mapContainer.style.transform = `scale(${scale})`;
        }

        // माउस ड्रैग (Pan) करने का फीचर
        let isDragging = false;
        let startX, startY;
        let translateX = 0, translateY = 0;

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            mapContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // सर्च फिल्टर फंक्शन
        function filterStates() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let nodes = document.querySelectorAll('.state-node');
            nodes.forEach(node => {
                let text = node.innerText.toLowerCase();
                if (text.includes(query)) {
                    node.style.display = 'block';
                } else {
                    node.style.display = query === '' ? 'block' : 'none';
                }
            });
        }
    </script>
</body>
</html>

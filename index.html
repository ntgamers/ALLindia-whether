<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NT Base - Weather Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- लॉगिन स्क्रीन --- */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .login-card {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 380px;
        }

        .login-logo {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-card h2 {
            font-size: 22px;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 6px;
        }

        .login-card p {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 30px;
        }

        .btn-auth {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-google {
            background: #ffffff;
            color: #24292e;
        }

        .btn-google:hover {
            background: #f3f4f6;
        }

        .btn-guest {
            background: rgba(255, 255, 255, 0.08);
            color: #f0f6fc;
        }

        .btn-guest:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* --- डैशबोर्ड स्क्रीन (लॉगिन के बाद) --- */
        #dashboard-screen {
            display: none;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .dashboard-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 380px;
        }

        .dashboard-card h2 {
            font-size: 20px;
            color: #f0f6fc;
            margin-bottom: 4px;
        }

        .dashboard-card p {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 25px;
        }

        .search-box-container {
            position: relative;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 15px 12px 40px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #58a6ff;
        }

        .search-icon-pos {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b949e;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-search {
            background: #238636;
            color: white;
            margin-bottom: 15px;
        }

        .btn-search:hover {
            background: #2ea043;
        }

        .btn-logout {
            background: rgba(248, 81, 73, 0.15);
            color: #f85149;
            border: 1px solid rgba(248, 81, 73, 0.4);
        }

        .btn-logout:hover {
            background: #f85149;
            color: #fff;
        }

        /* वेदर रिजल्ट बॉक्स */
        .weather-result {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: none;
        }

        .weather-result h3 {
            font-size: 16px;
            color: #58a6ff;
            margin-bottom: 5px;
        }

        .weather-temp {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin: 5px 0;
        }

        .weather-desc {
            font-size: 13px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <!-- 1. लॉगिन स्क्रीन -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo">⛅</div>
            <h2>NT Base</h2>
            <p>Sign In to access live weather dashboard</p>
            
            <button class="btn-auth btn-google" onclick="loginSuccess()">
                <svg height="16" width="16" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
                Continue with Google
            </button>
            
            <button class="btn-auth btn-guest" onclick="loginSuccess()">
                👤 Continue as Guest
            </button>
        </div>
    </div>

    <!-- 2. डैशबोर्ड स्क्रीन -->
    <div id="dashboard-screen">
        <div class="dashboard-card">
            <h2>Welcome, NT GAMER</h2>
            <p>Live Weather Information Portal</p>
            
            <div class="search-box-container">
                <span class="search-icon-pos">🔍</span>
                <input type="text" id="cityInput" class="search-input" placeholder="Enter city name (e.g. mumbai, delhi)">
            </div>

            <button class="btn-action btn-search" onclick="getWeather()">Search Weather</button>
            <button class="btn-action btn-logout" onclick="logout()">🚪 Logout</button>

            <!-- वेदर आउटपुट कार्ड -->
            <div id="weatherResult" class="weather-result">
                <h3 id="cityName">--</h3>
                <div class="weather-temp" id="weatherTemp">--°C</div>
                <div class="weather-desc" id="weatherDesc">--</div>
            </div>
        </div>
    </div>

    <script>
        function loginSuccess() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'flex';
        }

        function logout() {
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('cityInput').value = '';
            document.getElementById('weatherResult').style.display = 'none';
        }

        function getWeather() {
            let city = document.getElementById('cityInput').value.trim();
            let resultBox = document.getElementById('weatherResult');
            
            if(city === "") {
                alert("Please enter a city name!");
                return;
            }

            document.getElementById('cityName').innerText = city.toUpperCase() + ", IN";
            document.getElementById('weatherTemp').innerText = "23°C";
            document.getElementById('weatherDesc').innerText = "Few Clouds";
            resultBox.style.display = "block";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All India Weather</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 320px;
        }
        h2 { margin-bottom: 20px; color: #00bcd4; }
        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: #fff;
        }
        button {
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background-color: #00bcd4;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        button.guest { background-color: #4caf50; }
        .hidden { display: none; }
        #result { margin-top: 15px; font-size: 1.1em; color: #ffeb3b; }
    </style>
</head>
<body>

    <div class="card">
        <h2>All India Weather</h2>

        <!-- Login Box -->
        <div id="auth-box">
            <input type="text" id="username" placeholder="Enter Username">
            <button onclick="login('custom')">Login</button>
            <button class="guest" onclick="login('guest')">Continue as Guest</button>
        </div>

        <!-- Weather Box -->
        <div id="weather-box" class="hidden">
            <p id="user-display" style="color:#aaa;"></p>
            <input type="text" id="city" placeholder="Enter City (e.g. Pune)">
            <button onclick="getWeather()">Search Weather</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        function login(type) {
            let name = type === 'guest' ? 'guest' : document.getElementById('username').value;
            if (!name) name = 'Guest';

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: name })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('weather-box').classList.remove('hidden');
                document.getElementById('user-display').innerText = "Logged in as: " + data.message;
            });
        }

        function getWeather() {
            let city = document.getElementById('city').value || 'Mumbai';
            fetch(`/api/weather?city=${city}`)
            .then(res => res.json())
            .then(data => {
                if (data.main) {
                    document.getElementById('result').innerHTML = `
                        <strong>${data.name}</strong><br>
                        Temp: ${data.main.temp}°C<br>
                        Weather: ${data.weather[0].description}
                    `;
                } else {
                    document.getElementById('result').innerText = "City not found!";
                }
            });
        }
    </script>

</body>
</html>
